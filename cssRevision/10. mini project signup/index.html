<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>signup</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <div class="outer-box">
            <div class="inner-box">
                <header class="signup-header">
                    <h1>Signup</h1>
                    <p>It just takes 30 seconds</p>
                </header>
                <main class="signup-body">
                    <form action="#">
                        <p>
                            <label for="fullname">Full Name</label>
                            <input
                                type="text"
                                id="fullname"
                                placeholder="manish paul"
                                required
                            />
                        </p>
                        <p>
                            <label for="fullname">Your Email</label>
                            <input
                                type="email"
                                id="email"
                                placeholder="mkmanish123@gmail.com"
                                required
                            />
                        </p>
                        <p>
                            <label for="fullname">Your New Password</label>
                            <input
                                type="password"
                                id="password"
                                placeholder="at least 8 characters"
                                required
                            />
                        </p>
                        <p>
                            <label for="fullname">Submit</label>
                            <input
                                type="submit"
                                id="fullname"
                                value="Create accounts"
                            />
                        </p>
                    </form>
                </main>
                <footer class="signup-footer">
                    <p>Already have an Account? <a href="#">Login</a></p>
                </footer>
            </div>
            <div class="circle c1"></div>
            <div class="circle c2"></div>
        </div>
    </body>
</html>
